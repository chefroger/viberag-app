<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置 - VibeRAG</title>
    <link rel="stylesheet" href="/static/css/pico.min.css">
    <style>
        /* LibreUIUX Modern Design System */
        :root {
            /* Brand Colors */
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --primary-light: #60A5FA;
            --accent: #8B5CF6;

            /* Surfaces */
            --bg-primary: #FFFFFF;
            --bg-secondary: #F8FAFC;
            --bg-tertiary: #F1F5F9;
            --bg-glass: rgba(255, 255, 255, 0.9);

            /* Text */
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-muted: #94A3B8;

            /* Semantic */
            --success: #10B981;
            --warning: #F59E0B;
            --error: #EF4444;
            --info: #0EA5E9;

            /* Shadows */
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --shadow-primary: 0 4px 14px 0 rgba(59, 130, 246, 0.39);

            /* Animations */
            --ease-out: cubic-bezier(0.33, 1, 0.68, 1);
            --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
            --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
            --duration-fast: 150ms;
            --duration-normal: 200ms;
            --duration-slow: 300ms;

            /* Font sizes - 缩小基础字号 */
            --font-size-xs: 0.6875rem;
            --font-size-sm: 0.75rem;
            --font-size-base: 0.8125rem;
            --font-size-md: 0.875rem;
            --font-size-lg: 1rem;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            margin: 0;
            padding: 1.25rem;
            font-size: var(--font-size-sm);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        .settings-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .settings-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .config-row {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .config-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .settings-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .back-btn {
            font-size: var(--font-size-sm);
            text-decoration: none;
            color: var(--text-muted);
            transition: all var(--duration-normal) var(--ease-out);
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.5rem;
            background: var(--bg-primary);
            box-shadow: var(--shadow-sm);
        }

        .back-btn:hover {
            color: var(--primary);
            box-shadow: var(--shadow-md);
            transform: translateX(-2px);
        }

        h1 {
            font-size: var(--font-size-md);
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Glass Card */
        .settings-section {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(0, 0, 0, 0.04);
            transition: all var(--duration-normal) var(--ease-out);
        }

        .settings-section:hover {
            box-shadow: var(--shadow-xl);
        }

        .settings-section h2 {
            font-size: var(--font-size-sm);
            font-weight: 600;
            margin: 0 0 0.75rem 0;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 0.875rem;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.375rem;
            font-size: var(--font-size-xs);
            color: var(--text-secondary);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            height: 36px;
            padding: 0 0.75rem;
            background: var(--bg-secondary);
            border: 2px solid rgba(0, 0, 0, 0.06);
            border-radius: 0.5rem;
            font-size: var(--font-size-xs);
            transition: all var(--duration-normal) var(--ease-out);
            line-height: 1;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            background: var(--bg-primary);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .form-group .hint {
            font-size: var(--font-size-xs);
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        /* Modern Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.375rem;
            height: 36px;
            padding: 0 0.875rem;
            border-radius: 0.5rem;
            font-size: var(--font-size-xs);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--duration-normal) var(--ease-out);
            border: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: var(--shadow-primary);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-secondary {
            background: var(--bg-primary);
            color: var(--text-secondary);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: var(--shadow-sm);
        }

        .btn-secondary:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary:active {
            transform: scale(0.98);
        }

        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            padding: 0.875rem 1.25rem;
            background: var(--text-primary);
            color: white;
            border-radius: 0.875rem;
            font-size: var(--font-size-sm);
            box-shadow: var(--shadow-xl);
            z-index: 1000;
            animation: slideIn var(--duration-slow) var(--ease-out);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(1rem);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Status Indicators */
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: var(--font-size-sm);
            font-weight: 500;
            transition: all var(--duration-normal) var(--ease-out);
        }

        .status-success {
            background: linear-gradient(135deg, #D1FAE5, #A7F3D0);
            color: #065F46;
        }

        .status-error {
            background: linear-gradient(135deg, #FEE2E2, #FECACA);
            color: #991B1B;
        }

        .status-warning {
            background: linear-gradient(135deg, #FEF3C7, #FDE68A);
            color: #92400E;
        }
    </style>
</head>
<body>
    <div class="settings-container">
        <div class="settings-header">
            <a href="/" class="back-btn">←</a>
            <h1>⚙️ 设置</h1>
        </div>

        <!-- 第一行：LLM + Ollama 并排 -->
        <div class="settings-row">
            <!-- LLM 配置 -->
            <div class="settings-section">
                <h2>🤖 LLM 配置</h2>

                <div class="form-group">
                    <label>API 类型</label>
                    <select id="llm-provider" onchange="updateProviderFields()">
                        <option value="openai">OpenAI 兼容 API</option>
                        <option value="anthropic">Anthropic (Claude)</option>
                        <option value="custom">自定义 API</option>
                    </select>
                </div>

                <div class="form-group" id="api-base-url-group">
                    <label>API 地址</label>
                    <input type="text" id="api-base-url" placeholder="https://api.openai.com/v1">
                </div>

                <div class="form-group">
                    <label>API Key</label>
                    <input type="password" id="api-key" placeholder="sk-...">
                </div>

                <div class="form-group" id="model-group">
                    <label>模型名称</label>
                    <input type="text" id="model" placeholder="gpt-4o-mini">
                </div>

                <div style="display: flex; gap: 0.5rem; margin-top: 0.75rem;">
                    <button class="btn btn-primary" onclick="saveLLMConfig()">
                        💾 保存
                    </button>
                    <button class="btn btn-secondary" onclick="testLLMConnection()">
                        🧪 测试
                    </button>
                </div>
            </div>

            <!-- Ollama 配置 -->
            <div class="settings-section">
                <h2>📦 Ollama + 向量配置</h2>

                <div class="form-group">
                    <label>Ollama 地址</label>
                    <input type="text" id="ollama-host" value="http://localhost:11434">
                </div>

                <div id="ollama-status"></div>

                <div style="display: flex; gap: 0.5rem; margin-top: 0.75rem;">
                    <button class="btn btn-secondary" onclick="checkOllamaStatus()">
                        🔍 状态
                    </button>
                    <button class="btn btn-secondary" onclick="pullEmbeddingModel()">
                        📥 模型
                    </button>
                </div>

                <div style="border-top: 1px solid rgba(0,0,0,0.06); margin-top: 1rem; padding-top: 1rem;">
                    <div class="config-row">
                        <div class="form-group">
                            <label>Top-K</label>
                            <input type="number" id="top-k" value="5" min="1" max="20">
                        </div>
                        <div class="form-group">
                            <label>相似度阈值</label>
                            <input type="number" id="similarity-threshold" value="0.35" step="0.05" min="0" max="1">
                        </div>
                        <button class="btn btn-primary" onclick="saveVectorConfig()">
                            💾 保存
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        async function updateProviderFields() {
            const provider = document.getElementById('llm-provider').value;
            const apiBaseUrlGroup = document.getElementById('api-base-url-group');
            const apiBaseUrlInput = document.getElementById('api-base-url');

            // 设置默认 API 地址
            if (provider === 'openai') {
                apiBaseUrlInput.placeholder = 'https://api.openai.com/v1';
            } else if (provider === 'anthropic') {
                apiBaseUrlInput.placeholder = 'https://api.anthropic.com';
            } else {
                apiBaseUrlInput.placeholder = 'https://api.example.com/v1';
            }
        }

        async function loadSettings() {
            try {
                const response = await fetch('/api/settings');
                const data = await response.json();

                if (data.llm_provider) {
                    document.getElementById('llm-provider').value = data.llm_provider;
                    updateProviderFields();
                }
                if (data.api_base_url) {
                    document.getElementById('api-base-url').value = data.api_base_url;
                }
                if (data.model) {
                    document.getElementById('model').value = data.model;
                }
                if (data.api_key) {
                    document.getElementById('api-key').value = '********';
                }
                if (data.top_k) {
                    document.getElementById('top-k').value = data.top_k;
                }
                if (data.similarity_threshold) {
                    document.getElementById('similarity-threshold').value = data.similarity_threshold;
                }
            } catch (error) {
                console.error('加载设置失败:', error);
            }
        }

        async function saveLLMConfig() {
            const provider = document.getElementById('llm-provider').value;
            const apiKey = document.getElementById('api-key').value;
            const apiBaseUrl = document.getElementById('api-base-url').value.trim();
            const model = document.getElementById('model').value.trim();

            if (!model) {
                showToast('请填写模型名称');
                return;
            }

            // 构建请求体，只包含需要更新的字段
            const body = {
                llm_provider: provider,
                api_base_url: apiBaseUrl || null,
                model: model
            };

            // 只有当 API Key 有实际内容时才发送（空字符串表示要清空）
            if (apiKey && apiKey !== '********') {
                body.api_key = apiKey;
            }

            try {
                const response = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                if (response.ok) {
                    showToast('配置已保存');
                    // 如果填了新 API Key，更新显示为 ********
                    if (body.api_key) {
                        document.getElementById('api-key').value = '********';
                    }
                } else {
                    const data = await response.json();
                    showToast(data.detail || '保存失败');
                }
            } catch (error) {
                showToast(`错误：${error.message}`);
            }
        }

        async function testLLMConnection() {
            showToast('正在测试连接...');

            try {
                const response = await fetch('/api/settings/test-llm', {
                    method: 'POST'
                });

                const data = await response.json();

                if (data.status === 'ok') {
                    showToast('✅ 连接成功！');
                } else {
                    showToast('❌ 连接失败：' + (data.error || '未知错误'));
                }
            } catch (error) {
                showToast(`错误：${error.message}`);
            }
        }

        async function checkOllamaStatus() {
            const statusDiv = document.getElementById('ollama-status');
            statusDiv.innerHTML = '<div class="status-indicator status-warning">🔄 检查中...</div>';

            try {
                const response = await fetch('/api/settings/ollama/status');
                const data = await response.json();

                if (data.status === 'ok') {
                    statusDiv.innerHTML = '<div class="status-indicator status-success">✅ ' + data.message + '</div>';
                } else if (data.status === 'warning') {
                    statusDiv.innerHTML = '<div class="status-indicator status-warning">⚠️ ' + data.message + '</div>';
                } else {
                    statusDiv.innerHTML = '<div class="status-indicator status-error">❌ ' + data.message + '</div>';
                }
            } catch (error) {
                statusDiv.innerHTML = '<div class="status-indicator status-error">❌ 无法连接到 Ollama</div>';
            }
        }

        async function pullEmbeddingModel() {
            showToast('正在下载 Embedding 模型...');

            try {
                const response = await fetch('/api/settings/ollama/pull-model', {
                    method: 'POST'
                });

                const data = await response.json();

                if (data.status === 'started') {
                    showToast('✅ ' + data.message);
                } else {
                    showToast('❌ ' + (data.error || '下载失败'));
                }
            } catch (error) {
                showToast(`错误：${error.message}`);
            }
        }

        async function saveVectorConfig() {
            const topK = document.getElementById('top-k').value;
            const threshold = document.getElementById('similarity-threshold').value;

            try {
                const response = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        top_k: parseInt(topK),
                        similarity_threshold: parseFloat(threshold)
                    })
                });

                if (response.ok) {
                    showToast('配置已保存');
                } else {
                    showToast('保存失败');
                }
            } catch (error) {
                showToast(`错误：${error.message}`);
            }
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => toast.remove(), 3000);
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            checkOllamaStatus();
        });
    </script>
</body>
</html>
